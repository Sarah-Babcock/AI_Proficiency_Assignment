spring.application.name=url-shortener

# Links are stored in a file database in the project's data/ folder,
# so they survive restarting the app.
spring.datasource.url=jdbc:h2:file:./data/urlshortener
spring.datasource.username=sa
spring.datasource.password=
# Create or update the tables to match the Java classes on startup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
